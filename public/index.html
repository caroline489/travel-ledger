<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Travel Ledger</title>
<meta name="theme-color" content="#F7F2E7">
<title>Travel Ledger</title>
<style>
  :root{
    --paper: #F7F2E7;
    --paper-raised: #FCFAF3;
    --ink: #2A2420;
    --ink-soft: #6B6058;
    --line: #DCD2BE;
    --line-soft: #E9E1CF;
    --teal: #2E5750;
    --teal-deep: #1E3E39;
    --gold: #B4802E;
    --owe: #A64B3F;
    --owed: #3C6B4F;
    --radius: 12px;
    --shadow: 0 1px 0 rgba(42,36,32,0.06);
    --tap: 44px;
    --font-serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Noto Serif', 'PingFang TC', serif;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.5;
    padding: 20px 14px 90px;
  }
  .wrap{ max-width: 640px; margin: 0 auto; }

  /* ---------- Header ---------- */
  header{ margin-bottom: 20px; }
  .title-input{
    display:block; width:100%;
    font-family: var(--font-serif);
    font-weight:700;
    font-size: clamp(24px, 7vw, 32px);
    color: var(--teal-deep);
    border:none; background:transparent; outline:none;
    padding:2px 0;
  }
  .subtitle-input{
    display:block; width:100%;
    font-family:var(--font-sans);
    font-size: 13.5px;
    color: var(--ink-soft);
    border:none; background:transparent; outline:none;
    padding:2px 0;
  }
  .rule{ height:1px; background: var(--line); border:none; margin: 14px 0 0; }

  section{ margin-top: 26px; }

  /* ---------- Tabs ---------- */
  .tab-nav{
    display:flex; gap:0; border-bottom:1px solid var(--line);
    margin: 18px 0 20px; position: sticky; top:0; background: var(--paper);
    z-index: 5; padding-top: 6px;
  }
  .tab-btn{
    flex:1 1 0; border:none; background:transparent; cursor:pointer;
    font-family: var(--font-serif); font-weight:600; font-size:16px;
    color: var(--ink-soft); padding:10px 4px; text-align:center;
    border-bottom: 3px solid transparent; min-height: var(--tap);
  }
  .tab-btn.active{ color: var(--teal-deep); border-bottom-color: var(--gold); }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }
  h2{
    font-family: var(--font-serif); font-weight:600; font-size:18px;
    color: var(--teal-deep); margin: 0 0 12px;
  }

  /* ---------- Add expense form ---------- */
  .form-card{
    background: var(--paper-raised);
    border:1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
  }
  .form-grid{
    display:grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  label.field-label{
    display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:5px;
  }
  input[type=text], input[type=number], input[type=date], select{
    width:100%; min-height: var(--tap); padding:9px 10px;
    border:1px solid var(--line); border-radius:8px;
    background:#fff; color:var(--ink);
    font-family:var(--font-sans); font-size:15.5px;
    outline:none;
  }
  input:focus, select:focus{ border-color: var(--teal); }
  .amount-field{ display:flex; gap:8px; }
  .amount-field input[type=number]{ text-align:right; font-variant-numeric: tabular-nums; min-width:0; flex:1 1 auto; }
  .amount-field select{ width:84px; flex:0 0 84px; text-align:center; padding-left:6px; }
  .btn{
    border:none; border-radius:8px; padding:12px 18px; min-height: var(--tap);
    font-family:var(--font-sans); font-weight:600; font-size:15px;
    cursor:pointer; width:100%;
  }
  .btn-primary{ background: var(--teal); color:#fff; }
  .btn-primary:active{ background: var(--teal-deep); }
  .form-actions{ margin-top:14px; }

  /* ---------- Expense list (read-only cards, colour-coded by payer) ---------- */
  .expense-card{
    border-radius: var(--radius);
    padding: 10px 14px 6px;
    margin-bottom: 8px;
    border-left: 4px solid var(--line);
  }
  .expense-card.by-0{ background: #EAF1ED; border-left-color: var(--teal); }
  .expense-card.by-1{ background: #FBEADD; border-left-color: var(--gold); }
  .expense-card .info{ flex: 1 1 auto; min-width:0; }
  .expense-card .line1{
    display:flex; justify-content:space-between; align-items:baseline; gap:8px;
  }
  .expense-card .place{ font-weight:600; font-size:14.5px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .expense-card .amt{ font-family:var(--font-mono); font-size:14.5px; white-space:nowrap; flex:0 0 auto; }
  .expense-card .line2{
    display:flex; justify-content:space-between; align-items:baseline; gap:8px;
    margin-top:2px; font-size:12.5px; color:var(--ink-soft);
  }
  .expense-card .desc{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1 1 auto; min-width:0; }
  .expense-card .who-date{ flex:0 0 auto; white-space:nowrap; }
  .expense-card .card-footer{
    margin-top:8px; padding-top:6px; border-top:1px solid rgba(0,0,0,0.07);
    display:flex; justify-content:flex-start;
  }
  .delete-link{
    border:none; background:transparent; color:var(--ink-soft); cursor:pointer;
    font-size:12px; padding:4px 2px; opacity:0.75; text-decoration:underline;
  }
  .delete-link:active{ color:var(--owe); opacity:1; }
  .empty-state{
    color:var(--ink-soft); font-style:italic; padding:24px 14px; text-align:center;
    border:1px dashed var(--line); border-radius: var(--radius);
  }

  /* ---------- Currency summary ---------- */
  .currency-grid{ display:grid; grid-template-columns: 1fr; gap:12px; }
  .currency-card{
    background: var(--paper-raised); border:1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px;
  }
  .currency-card h3{
    font-family: var(--font-serif); font-weight:600; font-size:16px; margin:0 0 10px;
    color: var(--teal-deep); display:flex; justify-content:space-between; align-items:baseline;
  }
  .currency-card h3 .total{ font-family:var(--font-mono); font-size:15px; color:var(--ink); }
  .balance-line{
    display:flex; justify-content:space-between; font-size:14px; padding:4px 0;
  }
  .balance-line .amt{ font-family:var(--font-mono); }
  .no-entries-note{ color:var(--ink-soft); font-size:14px; font-style:italic; }

  /* ---------- Balances tab ---------- */
  .balance-card{
    background: var(--paper-raised); border:1px solid var(--line); border-radius: var(--radius);
    padding: 18px; margin-bottom: 12px;
  }
  .balance-card .cur-tag{
    font-family:var(--font-mono); font-size:12px; color:var(--ink-soft);
    background: var(--line-soft); border-radius:5px; padding:2px 7px; margin-right:10px;
  }
  .balance-card .headline{
    font-family: var(--font-serif); font-size:18px; font-weight:600; color: var(--teal-deep);
    display:block; margin-top:8px;
  }
  .balance-card .headline .amt{ font-family:var(--font-mono); color: var(--owe); }
  .balance-card.settled .headline{ color: var(--owed); font-style: italic; font-weight:500; font-size:16px; }
  .balance-card .detail{ font-size:12.5px; color:var(--ink-soft); margin-top:8px; }
  .balances-total-note{
    margin-top:16px; padding-top:14px; border-top:1px dashed var(--line);
    font-size:12.5px; color:var(--ink-soft);
  }

  footer{
    margin-top:32px; display:flex; justify-content:space-between; align-items:center;
    font-size:12px; color:var(--ink-soft); gap:12px; flex-wrap:wrap;
  }
  .status{ font-size:12px; color:var(--ink-soft); }
  .link-btn{ background:none; border:none; color:var(--ink-soft); text-decoration:underline; cursor:pointer; font-size:12px; padding:8px 0; }
  .link-btn:active{ color:var(--owe); }

  /* ---------- Wider screens ---------- */
  @media (min-width: 640px){
    body{ padding: 32px 20px 90px; }
    .wrap{ max-width: 760px; }
    .form-grid{ grid-template-columns: 1.1fr 1.5fr 0.85fr 0.85fr 0.9fr; }
    .currency-grid{ grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); }
    .form-actions{ display:flex; justify-content:flex-end; }
    .btn{ width:auto; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div style="display:flex; justify-content:flex-end;">
      <a href="https://trip-itinerary.caroline-8f6.workers.dev" target="_blank" rel="noopener" style="font-size:12.5px; color:var(--ink-soft); text-decoration:none; border-bottom:1px dotted var(--ink-soft);">→ 行程表</a>
    </div>
    <input id="tripTitle" class="title-input" value="Spain Trip" spellcheck="false">
    <input id="tripSubtitle" class="subtitle-input" value="Sep 22 – Oct 7 · shared ledger" spellcheck="false">
    <hr class="rule">
  </header>

  <div id="syncWarning" style="display:none; background:#A64B3F; color:#fff; padding:11px 14px; border-radius:8px; font-size:13px; margin-bottom:16px; font-weight:600; line-height:1.5;"></div>

  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="ledger">Ledger</button>
    <button class="tab-btn" data-tab="balances">Balances</button>
  </nav>

  <div class="tab-panel active" id="panel-ledger">
    <section style="margin-top:0;">
      <h2>Add an expense</h2>
      <div class="form-card">
        <div class="form-grid">
          <div>
            <label class="field-label">Place</label>
            <input type="text" id="f-place" placeholder="Barcelona">
          </div>
          <div>
            <label class="field-label">Description</label>
            <input type="text" id="f-desc" placeholder="10.7 chartered taxi">
          </div>
          <div>
            <label class="field-label">Date</label>
            <input type="date" id="f-date">
          </div>
          <div>
            <label class="field-label">Paid by</label>
            <select id="f-paidby"></select>
          </div>
          <div>
            <label class="field-label">Amount</label>
            <div class="amount-field">
              <input type="number" step="0.01" id="f-amount" placeholder="0.00">
              <select id="f-currency">
                <option value="EUR" selected>EUR</option>
                <option value="HKD">HKD</option>
                <option value="CNY">CNY</option>
                <option value="USD">USD</option>
              </select>
            </div>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" id="addBtn">Add expense</button>
        </div>
      </div>
    </section>

    <section>
      <h2>Expenses</h2>
      <div id="expenseList"></div>
    </section>
  </div>

  <div class="tab-panel" id="panel-balances">
    <section style="margin-top:0;">
      <h2>Who owes whom</h2>
      <div id="balancesList"></div>
    </section>

    <section>
      <h2>Totals by currency</h2>
      <div class="currency-grid" id="currencySummary"></div>
    </section>
  </div>

  <footer>
    <span class="status" id="statusLine">Loading…</span>
    <button class="link-btn" id="resetBtn">Reset all data</button>
  </footer>

</div>

<script>
(function(){
  const STORAGE_KEY = 'ledger-data-v1'; // localStorage key, works fully offline
  const API = '/api/ledger';            // Cloudflare Worker + KV, syncs the two of you when online

  let state = {
    tripTitle: 'Spain Trip',
    tripSubtitle: 'Sep 22 – Oct 7 · shared ledger',
    travelers: ['Wendy', 'Caro'],
    expenses: [
      mkExpense('Madrid to Granada', '09.22-10.3 chartered travel', '2026-09-22', 29400, 'CNY', 'Wendy'),
      mkExpense('Madrid to Granada', '09.22-10.3 hotels', '2026-09-22', 19141.87, 'HKD', 'Wendy'),
      mkExpense('Granada', '10.3 15:30 Alhambra ticket', '2026-10-03', 43.27, 'EUR', 'Caro'),
      mkExpense('Granada to Barcelona', '10.3 Flight VY2015 (JPQ4GH)', '2026-10-03', 375.98, 'EUR', 'Caro'),
      mkExpense('Barcelona', '10.3-10.7 Air BnB', '2026-10-03', 7680, 'HKD', 'Caro'),
      mkExpense('Barcelona', '10.7 chartered taxi', '2026-10-07', 1942, 'CNY', 'Wendy'),
      mkExpense('Barcelona', '10.5 Sagrada Familia', '2026-10-05', 72, 'EUR', 'Caro'),
    ]
  };

  function mkExpense(place, desc, date, amount, currency, paidBy){
    return {
      id: 'e' + Math.random().toString(36).slice(2, 10),
      place, desc, date, amount, currency: currency.toUpperCase(), paidBy
    };
  }

  const $ = (id) => document.getElementById(id);
  let saveTimer = null;

  function showSyncWarning(msg){
    const el = $('syncWarning');
    el.textContent = msg;
    el.style.display = 'block';
  }
  function hideSyncWarning(){
    $('syncWarning').style.display = 'none';
  }

  async function loadState(){
    // 1) instant local copy — works with zero network, even the first time offline after one visit
    try{
      const local = localStorage.getItem(STORAGE_KEY);
      if(local) state = Object.assign(state, JSON.parse(local));
    }catch(err){ console.log('No local copy yet, using seed data.'); }
    renderAll();
    $('statusLine').textContent = 'Loaded';

    // 2) try to pull the shared copy from the server
    try{
      const res = await fetch(API, { cache: 'no-store' });
      if(res.status === 401){
        showSyncWarning('⚠️ Not logged in — this device is NOT synced with the shared ledger. Reload the page and log in, or your edits will only save locally and may be lost.');
        $('statusLine').textContent = 'Not logged in';
        return;
      }
      if(res.ok){
        const text = await res.text();
        if(text && text !== '{}'){
          state = Object.assign(state, JSON.parse(text));
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          renderAll();
        }
        hideSyncWarning();
      } else {
        showSyncWarning('⚠️ Could not reach the shared ledger (server error). Showing your last saved copy — new edits may not sync until this is resolved.');
      }
      $('statusLine').textContent = 'Synced';
    }catch(err){
      $('statusLine').textContent = 'Offline — showing your last saved copy';
      showSyncWarning('⚠️ Offline — showing your last saved copy. New edits are saved on this device but will only sync once you\'re back online.');
    }
  }

  function queueSave(){
    $('statusLine').textContent = 'Saving…';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      // always save locally first so nothing is lost even with no connection
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(err){ console.error('localStorage error:', err); }
      try{
        const res = await fetch(API, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(state)
        });
        if(res.status === 401){
          showSyncWarning('⚠️ Not logged in — this edit was NOT saved to the shared ledger, only on this device. Reload the page and log in to fix this.');
          $('statusLine').textContent = 'NOT synced — not logged in';
        } else if(res.ok){
          hideSyncWarning();
          $('statusLine').textContent = 'Saved · synced';
        } else {
          showSyncWarning('⚠️ This edit was NOT saved to the shared ledger (server error) — only on this device.');
          $('statusLine').textContent = 'Saved on this device only';
        }
      }catch(err){
        showSyncWarning('⚠️ Offline — this edit is saved on this device only. It will sync automatically once you\'re back online (keep this tab open, or reopen it before clearing browser data).');
        $('statusLine').textContent = 'Saved on this device — will sync when back online';
      }
    }, 350);
  }

  function fmt(n){
    return (Math.round((n + Number.EPSILON) * 100) / 100).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escapeAttr(s){ return escapeHtml(s); }

  /* ---------------- Travelers (fixed at two, not editable) ---------------- */
  function renderTravelers(){
    const paidBySel = $('f-paidby');
    paidBySel.innerHTML = state.travelers.map(t => `<option value="${escapeAttr(t)}">${escapeHtml(t)}</option>`).join('');
  }

  /* ---------------- Expense list ---------------- */
  function renderExpenseList(){
    const list = $('expenseList');
    list.innerHTML = '';
    if(state.expenses.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'No expenses yet — add your first one above.';
      list.appendChild(empty);
      return;
    }
    const sorted = state.expenses.slice().sort((a,b) => (a.date||'').localeCompare(b.date||''));
    sorted.forEach(exp => list.appendChild(buildCard(exp)));
  }

  function fmtDate(d){
    if(!d) return '';
    const parts = d.split('-');
    if(parts.length !== 3) return d;
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${months[parseInt(parts[1],10)-1]} ${parseInt(parts[2],10)}`;
  }

  function buildCard(exp){
    const card = document.createElement('div');
    const payerIdx = state.travelers.indexOf(exp.paidBy);
    card.className = 'expense-card by-' + (payerIdx === 1 ? '1' : '0');
    card.dataset.id = exp.id;

    const info = document.createElement('div');
    info.className = 'info';

    const line1 = document.createElement('div');
    line1.className = 'line1';
    line1.innerHTML = `<span class="place">${escapeHtml(exp.place)}</span><span class="amt">${fmt(exp.amount)} ${escapeHtml(exp.currency)}</span>`;

    const line2 = document.createElement('div');
    line2.className = 'line2';
    line2.innerHTML = `<span class="desc">${escapeHtml(exp.desc)}</span><span class="who-date">${escapeHtml(exp.paidBy)} · ${fmtDate(exp.date)}</span>`;

    info.appendChild(line1);
    info.appendChild(line2);

    const footer = document.createElement('div');
    footer.className = 'card-footer';
    const delBtn = document.createElement('button');
    delBtn.className = 'delete-link'; delBtn.textContent = 'Delete';
    delBtn.addEventListener('click', () => {
      if(!confirm(`Delete "${exp.place}" — ${exp.desc}?`)) return;
      state.expenses = state.expenses.filter(e => e.id !== exp.id);
      queueSave(); renderExpenseList(); updateSummary(); renderBalances();
    });
    footer.appendChild(delBtn);

    card.appendChild(info);
    card.appendChild(footer);
    return card;
  }

  /* ---------------- Add expense form ---------------- */
  function setupForm(){
    $('addBtn').addEventListener('click', () => {
      const place = $('f-place').value.trim();
      const desc = $('f-desc').value.trim();
      const date = $('f-date').value;
      const amount = parseFloat($('f-amount').value);
      const currency = ($('f-currency').value || 'EUR').toUpperCase();
      const paidBy = $('f-paidby').value;

      if(!place && !desc){ alert('Add at least a place or a description.'); return; }
      if(!amount || amount <= 0){ alert('Enter an amount greater than 0.'); return; }

      state.expenses.push(mkExpense(place || '—', desc || '—', date, amount, currency, paidBy));
      queueSave();

      $('f-place').value=''; $('f-desc').value=''; $('f-amount').value='';
      renderExpenseList(); updateSummary(); renderBalances();
    });
  }

  /* ---------------- Per-currency breakdown (used by both tabs) ---------------- */
  function currencyBreakdown(){
    const [A, B] = state.travelers;
    const currencies = [...new Set(state.expenses.map(e => e.currency))].sort();
    return currencies.map(cur => {
      const relevant = state.expenses.filter(e => e.currency === cur);
      const total = relevant.reduce((s,e) => s + e.amount, 0);
      const paid = { [A]: 0, [B]: 0 };
      relevant.forEach(e => { paid[e.paidBy] = (paid[e.paidBy] || 0) + e.amount; });
      const net = { [A]: paid[A] - total / 2, [B]: paid[B] - total / 2 };
      return { currency: cur, total, paid, net };
    });
  }

  /* ---------------- Totals by currency (Balances tab) ---------------- */
  function updateSummary(){
    const box = $('currencySummary');
    box.innerHTML = '';
    const rows = currencyBreakdown();

    if(rows.length === 0){
      box.innerHTML = '<div class="no-entries-note">Once you add expenses, totals per currency will show up here.</div>';
      return;
    }

    rows.forEach(({currency, total, paid}) => {
      const card = document.createElement('div');
      card.className = 'currency-card';
      let html = `<h3>${currency} <span class="total">${fmt(total)}</span></h3>`;
      state.travelers.forEach(t => {
        html += `<div class="balance-line"><span>${escapeHtml(t)} paid</span><span class="amt">${fmt(paid[t]||0)}</span></div>`;
      });
      card.innerHTML = html;
      box.appendChild(card);
    });
  }

  /* ---------------- Who owes whom (Balances tab) ---------------- */
  function renderBalances(){
    const list = $('balancesList');
    list.innerHTML = '';
    const [A, B] = state.travelers;
    const rows = currencyBreakdown();

    if(rows.length === 0){
      list.innerHTML = '<div class="no-entries-note">Add some expenses and this will show exactly what each of you owes the other, currency by currency.</div>';
      return;
    }

    rows.forEach(({currency, net, paid}) => {
      const card = document.createElement('div');
      const owesName = net[A] < net[B] ? A : B;
      const owedName = owesName === A ? B : A;
      const amount = Math.abs(net[A] - net[B]) / 2;
      const detail = `${escapeHtml(A)} paid ${fmt(paid[A]||0)} · ${escapeHtml(B)} paid ${fmt(paid[B]||0)}`;

      if(amount < 0.01){
        card.className = 'balance-card settled';
        card.innerHTML = `<span class="cur-tag">${currency}</span><span class="headline">Settled up</span><div class="detail">${detail}</div>`;
      } else {
        card.className = 'balance-card';
        card.innerHTML = `<span class="cur-tag">${currency}</span><span class="headline">${escapeHtml(owesName)} owes ${escapeHtml(owedName)} <span class="amt">${fmt(amount)}</span></span><div class="detail">${detail}</div>`;
      }
      list.appendChild(card);
    });

    const note = document.createElement('div');
    note.className = 'balances-total-note';
    note.textContent = 'Each currency is settled separately — no exchange rate is applied between them.';
    list.appendChild(note);
  }

  /* ---------------- Tabs ---------------- */
  function setupTabs(){
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        $('panel-' + btn.dataset.tab).classList.add('active');
        window.scrollTo({top:0, behavior:'smooth'});
      });
    });
  }

  /* ---------------- misc ---------------- */
  function renderAll(){
    $('tripTitle').value = state.tripTitle;
    $('tripSubtitle').value = state.tripSubtitle;
    renderTravelers();
    renderExpenseList();
    updateSummary();
    renderBalances();
  }

  $('tripTitle').addEventListener('input', () => { state.tripTitle = $('tripTitle').value; queueSave(); });
  $('tripSubtitle').addEventListener('input', () => { state.tripSubtitle = $('tripSubtitle').value; queueSave(); });
  $('resetBtn').addEventListener('click', () => {
    if(!confirm('This clears every expense on this ledger. Continue?')) return;
    state = { tripTitle: state.tripTitle, tripSubtitle: state.tripSubtitle, travelers: state.travelers.slice(), expenses: [] };
    queueSave(); renderAll();
  });

  setupForm();
  setupTabs();
  loadState();

  // when the connection comes back, push whatever is saved locally to the server
  window.addEventListener('online', () => { queueSave(); });

  // service worker caches the app shell so the page still opens with no connection at all
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
